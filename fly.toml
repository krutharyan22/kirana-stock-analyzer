# Fly.io configuration for Kirana Stock Analyzer
app = "kirana-stock-analyzer"
primary_region = "iad"

[env]
  PYTHONUNBUFFERED = "true"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true

[[mounts]]
  source = "kirana_data"
  destination = "/app/backend"
